spring.application.name=worklog-api
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/worklog?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Claude API (Spring AI 2.0.2). ANTHROPIC_API_KEY는 Claude Code 구독 인증과 충돌하므로 쓰지 않는다.
spring.ai.anthropic.api-key=${WORKLOG_ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-haiku-5-5
# 비용 상한: 답변은 최대 500토큰, 장애 시 30초 x (1 + 재시도 1회) 안에 실패를 돌려준다.
spring.ai.anthropic.chat.max-tokens=500
spring.ai.anthropic.timeout=30s
spring.ai.anthropic.max-retries=1